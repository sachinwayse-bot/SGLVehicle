name: Build SGL Vehicle APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          ls -la
          test -f SGL_Vehicle_Android_Project_v2.zip

      - name: Extract Android project
        run: |
          mkdir -p android_project
          unzip -o SGL_Vehicle_Android_Project_v2.zip -d android_project

      - name: Find Gradle wrapper
        id: find_project
        run: |
          GRADLEW=$(find android_project -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found in ZIP file."
            echo "ZIP contents:"
            find android_project -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project found at: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: .
        env:
          PROJECT_DIR: ${{ steps.find_project.outputs.project_dir }}
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SGL-Vehicle-APK
          path: android_project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
