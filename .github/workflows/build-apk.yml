name: Build SGL Vehicle APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Check ZIP file
        run: |
          if [ ! -f "SGL_Vehicle_Android_Project_v2.zip" ]; then
            echo "ERROR: Android project ZIP not found!"
            ls -la
            exit 1
          fi

      - name: Extract Android project
        run: |
          mkdir -p extracted_project
          unzip -o SGL_Vehicle_Android_Project_v2.zip \
            -d extracted_project

          echo "Extracted files:"
          find extracted_project -maxdepth 5 -type f | head -100

      - name: Find Android project
        run: |
          SETTINGS_FILE=$(find extracted_project \
            -type f -name settings.gradle \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            SETTINGS_FILE=$(find extracted_project \
              -type f -name settings.gradle.kts \
              -print -quit)
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle not found!"
            find extracted_project -maxdepth 6 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SGL-Vehicle-APK
          path: extracted_project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
